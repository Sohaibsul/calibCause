_base_: base.yaml
# Reviewer fix: "the vascular expert seems useless -- it doesn't appear in
# the routing chart". Root cause was that entropy_regularizer only constrains
# per-sample gate entropy, which does not stop the dataset-wide mean usage of
# one expert collapsing to ~0 (see routing_share.png). This config adds the
# new dataset-wide load_balance_loss on top of the existing (unchanged)
# architecture and everything else from stage2_moe.yaml, so it is a direct,
# minimal-diff re-run -- not a new model.
out_dir: runs/stage2_balanced
model:
  quality_mode: calibrated
train:
  epochs: 30
  batch_size: 6
  lr: 3.0e-4
  load_balance_weight: 0.2   # new: penalises batch-mean gate usage deviating from 1/3 per expert
